<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Fotografia artystyczna</h1>
        <!--skonczone-->
    </header>
    <section id="obrazy">
        <img src="1.jpg" alt="obrazy do sprzedaży" title="1.jpg">
        <img src="2.jpg" alt="obrazy do sprzedaży" title="2.jpg">
        <img src="3.jpg" alt="obrazy do sprzedaży" title="3.jpg">
        <img src="4.jpg" alt="obrazy do sprzedaży" title="4.jpg">
        <img src="5.jpg" alt="obrazy do sprzedaży" title="5.jpg">
        <img src="6.jpg" alt="obrazy do sprzedaży" title="6.jpg">
        <img src="7.jpg" alt="obrazy do sprzedaży" title="7.jpg">
        <img src="8.jpg" alt="obrazy do sprzedaży" title="8.jpg">
        <img src="9.jpg" alt="obrazy do sprzedaży" title="9.jpg">
        <img src="10.jpg" alt="obrazy do sprzedaży" title="10.jpg">
    </section>
    <main>
        <section id="lewy">
            <h3>Zamówienie</h3>
            <label for="obraz">Wybierz obraz:</label>
            <input type="file" name="obraz" id="obraz" accept=".jpg, .jpeg, image/jpeg"><br>
            <label for="kopia">Liczba Kopii:</label>
            <input type="number" name="kopia" id="kopia"><br>
            <input type="radio" name="rodzaj" id="blyszczacy" checked>Papier błyszczący <br>
            <input type="radio" name="rodzaj" id="matowy">Papier matowy<br>
            <input type="submit" value="Dodaj do koszyka" onclick="funkcja1()">
        </section>
        <nav>
            <ul>
                <li><a href="regulamin.html">Regulamin</a></li>
                <li><a href="usługi.html">Usługi</a></li>
                <li><a href="https://pixabay.com.html">Zdjęcia</a></li>
            </ul>
        </nav>

        <section id="prawy">


            <h3>Koszyk</h3>
            <div id="kontener">

            </div>
        </section>
    </main>
    <footer>
        <p>Autor strony <em>000000000000</em></p>
    </footer>
    <script>
        function funkcja1() {
            let pliki = document.getElementById("obraz").files[0].name ?? "brak";
            let kopia = document.getElementById("kopia").value;
            let papierBlyszczacy = document.getElementById("blyszczacy").checked;

            let mnoznik = papierBlyszczacy == true ? 1.5 : 2;
            let cena = kopia * mnoznik;
            console.log(cena);
            let kontener = document.getElementById('kontener');
            let img = document.createElement('img');
            img.setAttribute('src', pliki);
            kontener.appendChild(img);

            let p1 = document.createElement('p');
            p1.innerHTML = `Liczba kopii: ${kopia}`;
            kontener.appendChild(p1);

            let p2 = document.createElement('p');
            p2.innerHTML = `Cena: ${cena}`;
            kontener.appendChild(p2);

        }
    </script>
</body>

</html>
