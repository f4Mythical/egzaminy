<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer zadań</title>
    <link rel="stylesheet" href="styl.css">
</head>

<body>
    <aside><img src="obraz.jpg"></aside>
    <header>
        <h2>Moje zadania</h2>
    </header>
    <nav>
        <input type="text" name="nazwa" id="nazwa" placeholder="Dodaj zadanie...">
        <input type="submit" value="Dodaj" name="dodaj" id="dodaj" onClick="dodaj()">
    </nav>
    <main>
        <ul>
            <li>Wyprowadzić psa<button onclick="zaznacz(1)">Wykonane</button></li>
            <li>Gimnastyka<button onclick="zaznacz(2)">Wykonane</button></li>
            <li>Zakupy<button onclick="zaznacz(3)">Wykonane</button></li>
            <li>Spacer z kumplem <button onclick="zaznacz(4)">Wykonane</button></li>
            <li>Odrabianie lekcji z młodszą siostrą <button onclick="zaznacz(5)">Wykonane</button></li>
            <li>Projekt na geografię <button onclick="zaznacz(6)">Wykonane</button></li>

        </ul>
    </main>
    <footer><h3>Notatki: 0000000</h3></footer>
    <script>
function zaznacz(liczbaZadania){
    var element = document.querySelectorAll('li');
    element[liczbaZadania - 1].style.textDecoration = "line-through";
}
function dodaj(){
var nazwa = document.getElementById("nazwa").value;
var lista = document.querySelector("ul");
var ilosc = document.querySelectorAll("li").length;
var iloscNowe = ilosc +1 ;
var nowyElement = document.createElement("li");
nowyElement.innerHTML = nazwa + '<button onclick="zaznacz(' + iloscNowe +')">Wykonane';
lista.appendChild(nowyElement);

}
</script>
</body>

</html>
