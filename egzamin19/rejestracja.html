<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep - rejestracja</title>
    <link rel="stylesheet" href="styl.css">
</head>

<body>
    <aside>
        <img src="obraz.png" alt="promocje">
        <h2>Sprawdź promocje</h2>
        <table>
            <tr>
                <th>co?</th>
                <th>ile taniej?</th>

            </tr>
            <tr>
                <td>ubrania</td>
                <td>15%</td>
            </tr>
            <tr>
                <td>buty</td>
                <td>25%</td>
            </tr>
        </table>
    </aside>
    <header>
        <h1>Zarejestruj się w sklepie</h1>
    </header>
    <main>
        <button id="button1" onclick="znikniecie(1)">Klient</button>
        <button id="button2" onclick="znikniecie(2)">Adres</button>
        <button id="button3" onclick="znikniecie(3)">Kontakt</button>
        <section id="blok1">
            <p>Imię</p>
            <input type="text" placeholder="Wypisz dane..." name="imie" id="imie" onfocusout="stracenie()">
            <p>Nazwisko</p>
            <input type="text" name="nazwisko" id="nazwisko"  onfocusout="stracenie()" >
            <p>Data urodzenia</p>
            <input type="date" name="data" id="data"  onfocusout="stracenie()">
        </section>
        <section id="blok2">
            <p>Ulica</p>
            <input type="text" name="ulica" id="ulica"  onfocusout="stracenie()">
            <p>Numer</p>
            <input type="number" name="numer" id="numer"  onfocusout="stracenie()">
            <p>Miasto</p>
            <input type="text" name="miasto" id="miasto"  onfocusout="stracenie()">
        </section>
        <section id="blok3">
            <p>Numer komorkowy</p>
            <input type="number" name="telefon" id="telefon"  onfocusout="stracenie()">
            <input type="checkbox" name="rodo" id="rodo"  onfocusout="stracenie()" >Akceptuję RODO
            <button onclick="zatwierdzajaca()">Zatwierdz dane</button>
        </section>
    </main>
<section id="pasek-kontener">
        <section id="wskaznik-postepu"></section>
    </section>

    <footer>
        <h4>Rejestracje do sklepu wykonał: 000000</h4>
    </footer>
    <script>
function znikniecie(element){
    let blok1 = document.getElementById("blok1");
    let blok2 = document.getElementById("blok2");
    let blok3 = document.getElementById("blok3");
    if(element == 1) {
        blok1.style.display = "block";
        blok2.style.display = "none";
        blok3.style.display = "none";
    }
    else if(element == 2) {
        blok1.style.display = "none";
        blok2.style.display = "block";
        blok3.style.display = "none";
    }
    else if(element == 3){
                blok1.style.display = "none";
        blok2.style.display = "none";
        blok3.style.display = "block";
    }
    
}
function zatwierdzajaca(){
        let imie = document.getElementById("imie").value;
        let nazwisko = document.getElementById("nazwisko").value;
        let data = document.getElementById("data").value;
        let ulica = document.getElementById("ulica").value;
        let numer = document.getElementById("numer").value;
        let miasto = document.getElementById("miasto").value;
        let telefon = document.getElementById("telefon").value;
        let isRodo = document.getElementById("rodo").checked;
        let rodo = isRodo == true ? "on" : "off";
        console.log(imie, ",", nazwisko, ",", data,",", ulica,",",numer,",",miasto,",",telefon,",",rodo);
    }
        let i = 4;

function stracenie(){
    let postep = document.getElementById("wskaznik-postepu");
 
    i += 12;
        if(i>100){
     i=100;
    }
    console.log(i);
    postep.style.width = `${i}%`;
   
}
        </script>
</body>

</html>
