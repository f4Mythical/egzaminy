<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacja paliw</title>
    <link rel="stylesheet" href="styl2.css">
</head>
<body>
    <header>
        <h1>Całodobowa stacja paliw</h1>
    </header>
    <nav>
        <a href="stacja.html"><img src="home.png"></a>
        <a href="obliczenia.html"><img src="znak.png"></a>
        <a href="kwerendy.txt">Pobierz dokumenty</a>
    </nav>
    <section id="lewy">
        <h2>Orientacyjny koszt paliwa</h2>
        <label for="rodzaj">Rodzaj paliwa (1-benzyna, 2-olej napędowy):</label><br>
        <input type="number" name="rodzaj" id="rodzaj"><br>
        <label for="litry">Ile litrów?</label><br>
        <input type="number" name="litry" id="litry"><br>
        <button type="button" onclick="oblicz()">OBLICZ</button>
        <p id="wynik"></p>
    </section>
    <section id="prawy">
        <img src="samochod.png" alt="samochód">
    </section>
    <footer>
        <p>Strone opracował: 0000000</p>
    </footer>
    <script>
        function oblicz(){
            let rodzaj = document.getElementById('rodzaj').value;
            let litry = document.getElementById('litry').value;
            let cena = rodzaj == 1 ? 4 : (rodzaj == 2 ? 3.5 : 0);
            console.log(cena);
            let wynik = document.getElementById('wynik');
            let wartosc = cena * litry;
            wynik.innerHTML = `koszt paliwa ${wartosc} zl`;
        }
        </script>
</body>
</html>
