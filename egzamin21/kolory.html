<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomocnik css</title>
    <link rel="stylesheet" href="styl2.css">
</head>
<body>
    <div id="kon">
        <header>
            <h1>Pomocnik CSS</h1>
        </header>
        <header>
            <ul>
                <li><a href="kolory.html">Kolory</a></li>
                <li><a href="czcionki.html">Czcionki</a></li>
                <li><a href="style.html">Style</a></li>
                <li><a href="https://www.w3schools.com/css/" target="_blank">Pomoc</a></li>

            </ul>
        </header>
        <main>
            <h2>Podaj składową H koloru w kodzie HSL</h2>
            <p>0 do 30 czerwienie, do 60 żółcie, do 150 zielenie, do 250 niebieskie, do 360 fiolet i purpura</p>
            <img src="kolory.jpg" alt="Przestrzeń barw HSL" srcset="" ><br>
            <input type="number" name="liczba" id="liczba" max="360" placeholder="0 - 360">
            <button onclick="generuj()">Generuj palete</button>
            <table>
                <tr><td colspan="4" id="glowny">Kolor glowny</td></tr>
                <tr><td id="kolor2">kolor 2</td>
                <td id="kolor3">kolor 3</td>
                <td id="kolor4">kolor 4</td>
                <td id="kolor5">kolor 5</td>
                </tr>
            </table>
        </main>
        <footer>
<p>Autor: 0000000000</p>
        </footer>
    </div>
    <script>
function generuj(){
    var wartoscH = document.getElementById('liczba').value;
    console.log(wartoscH);
    var wartoscL = "50%" ;
    console.log(wartoscL);
    var glowny = document.getElementById("glowny");
    var kolor2= document.getElementById('kolor2');
    var kolor3= document.getElementById('kolor3');
    var kolor4= document.getElementById('kolor4');
    var kolor5= document.getElementById('kolor5');
        glowny.style.backgroundColor = `hsl(${wartoscH}, 100%, ${wartoscL})`;
        kolor2.style.backgroundColor = `hsl(${wartoscH}, 80%, ${wartoscL})`;
        kolor3.style.backgroundColor = `hsl(${wartoscH}, 60%, ${wartoscL})`;
        kolor4.style.backgroundColor = `hsl(${wartoscH}, 40%, ${wartoscL})`;
        kolor5.style.backgroundColor = `hsl(${wartoscH}, 20%, ${wartoscL})`;

}

    </script>
</body>
</html>
